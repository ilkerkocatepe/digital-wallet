services:
  digital-wallet:
    build:
      context: .
      dockerfile: Dockerfile
    healthcheck:
      test: "curl --fail --silent localhost:8080/healthcheck | grep OK || exit 1"
      interval: 20s
      retries: 3
      start_period: 20s
      timeout: 5s
    deploy:
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        delay: 20s
      restart_policy:
        condition: on-failure